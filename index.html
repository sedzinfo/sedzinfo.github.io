<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A directory of Sedzinfo's GitHub Pages sites.">
  <title>Sedzinfo — Sites</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }

    main {
      width: min(100%, 760px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 0.75rem 0 2rem;
      color: #536178;
      font-size: 1.05rem;
    }

    .sites {
      display: grid;
      gap: 1rem;
    }

    .site {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid #dce4ef;
      border-radius: 0.9rem;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .site:hover,
    .site:focus-visible {
      transform: translateY(-2px);
      border-color: #7c9cff;
      box-shadow: 0 8px 24px rgb(23 32 51 / 8%);
    }

    .site:focus-visible {
      outline: 3px solid #315ee8;
      outline-offset: 3px;
    }

    .site-name {
      display: block;
      font-size: 1.15rem;
      font-weight: 650;
    }

    .site-url {
      display: block;
      margin-top: 0.25rem;
      color: #64738b;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .arrow {
      flex: 0 0 auto;
      color: #315ee8;
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sedzinfo sites</h1>
    <p class="intro">Explore my GitHub Pages projects.</p>
    <nav class="sites" aria-label="GitHub Pages sites">
      <a class="site" href="https://sedzinfo.github.io/vignettes/">
        <span>
          <span class="site-name">Vignettes</span>
          <span class="site-url">sedzinfo.github.io/vignettes/</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="site" href="https://sedzinfo.github.io/rwf/">
        <span>
          <span class="site-name">RWF</span>
          <span class="site-url">sedzinfo.github.io/rwf/</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="site" href="https://sedzinfo.github.io/worldbankmodular/">
        <span>
          <span class="site-name">World Bank Modular</span>
          <span class="site-url">sedzinfo.github.io/worldbankmodular/</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
